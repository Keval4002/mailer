name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mailtfoutofit
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install deps
        run: uv venv --python 3.11 .venv && uv pip install --python .venv/bin/python -r requirements.txt

      - name: Run tests
        run: source .venv/bin/activate && pytest

  frontend-build:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000